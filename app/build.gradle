plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'org.tetra.receiver'
    compileSdk 34

    defaultConfig {
        applicationId "org.tetra.receiver"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"

        externalNativeBuild {
            cmake {
                cppFlags ""
                abiFilters "arm64-v8a", "armeabi-v7a"
            }
        }
    }

    buildTypes {
        debug {
            // In-app debug facilities: stdout/stderr log capture, iq.bin /
            // bits.bin / diag.txt dumps, periodic status.
            externalNativeBuild {
                cmake { arguments "-DTETRA_DEBUG=ON" }
            }
        }
        release {
            // No debug facilities, minified, resource-shrunk, native symbols
            // stripped.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'
            externalNativeBuild {
                cmake { arguments "-DTETRA_DEBUG=OFF" }
            }
            ndk {
                debugSymbolLevel 'none'
            }
            // Signed with the debug key so `assembleRelease` is directly
            // installable.  Replace with a real keystore for distribution.
            signingConfig signingConfigs.debug
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version "3.22.1"
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
